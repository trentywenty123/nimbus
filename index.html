<!DOCTYPE html>
<!--
  NIMBUS - a horror game dressed up as a joke web page.

  login -> plans -> checkout -> processing -> payment complete
        -> fake "hacked" terminal -> popup overload -> the dark part
        -> fake BIOS reboot -> the layers below -> the basement -> the end

  Nothing here is real and nothing leaves the page: no server, no storage,
  no network requests, no camera, no microphone. The card, the receipt, the
  terminal, the popups and the "reboot" are all made up. Use a made-up
  name and password; the game never reads the password.

  Press Q at any point after payment to fast-forward whatever is running.
  The ▶▶ button (or ]) finishes the current line of dialogue.

  Cheat codes - type as the USERNAME, password can be blank:
    layer1  forum        layer2  1997 archive     layer3  doors
    layer4  the name     layer5  the copy         maze    basement
    hack    act one terminal   dark  the dark part   bios  reboot
    syslog  green text dies    scare room + face     theend final screen
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus — Cloud storage that keeps up with you</title>
<link id="fav" rel="icon" href="">
<style>
  :root{
    --bg-top:#150a2e; --bg-mid:#0b1030; --bg-bot:#04161f;
    --card:#141a2b; --card-hi:#1c2438; --field:#10162a; --line:#2c3550;
    --text:#f2f5ff; --muted:#98a2bd;
    --red:#ff5e7a; --green:#3ce68f; --cyan:#39d6ff; --gold:#ffcc4d;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--text); overflow-x:hidden;
    background:
      radial-gradient(80vw 60vh at 10% -10%, rgba(90,31,176,.35), transparent 60%),
      radial-gradient(80vw 60vh at 95% 110%, rgba(15,125,140,.35), transparent 60%),
      linear-gradient(180deg, var(--bg-top), var(--bg-mid) 50%, var(--bg-bot));
    background-attachment:fixed; min-height:100%;
  }
  body.rot1{ filter:saturate(1.1) }
  body.rot2{ filter:saturate(1.2) hue-rotate(-8deg) }
  body.rot3{ filter:saturate(1.3) hue-rotate(-16deg) contrast(1.05) }
  body.rot4{ filter:saturate(1.5) hue-rotate(-24deg) contrast(1.1); animation:tilt 9s ease-in-out infinite }
  @keyframes tilt{ 50%{ transform:rotate(.35deg) } }

  @keyframes spin{ to{ transform:rotate(360deg) } }
  @keyframes slide{ to{ background-position:300% 0 } }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 18px rgba(57,214,255,.45), 0 0 42px rgba(57,214,255,.18) }
    50%    { box-shadow:0 0 26px rgba(255,80,220,.55), 0 0 62px rgba(255,80,220,.22) }
  }
  .rgb-text{
    background:linear-gradient(90deg,#ff5f9e,#ffcc4d,#3ce68f,#39d6ff,#a06bff,#ff5f9e);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:slide 7s linear infinite;
    filter:drop-shadow(0 0 16px rgba(160,107,255,.45));
  }
  .rgb-frame{ position:relative; border-radius:22px }
  .rgb-frame .ring, .rgb-frame .halo{
    position:absolute; border-radius:inherit; pointer-events:none;
    background:conic-gradient(from 0deg,#ff5f9e,#ffcc4d,#3ce68f,#39d6ff,#a06bff,#ff2d9e,#ff5f9e);
    animation:spin 3.6s linear infinite;
  }
  .rgb-frame .ring{ inset:-3px }
  .rgb-frame .halo{ inset:-18px; filter:blur(28px); opacity:.65 }
  .rgb-frame > .card{ position:relative; z-index:1; background:var(--card); border-color:transparent }

  .promo{ text-align:center; font-size:12px; padding:8px 12px; color:#1a0b2e; font-weight:700;
          background:linear-gradient(90deg,#ffcc4d,#ff8fb1,#39d6ff); }
  .nav{ display:flex; align-items:center; gap:26px; padding:14px 26px;
        border-bottom:1px solid var(--line); background:rgba(20,26,43,.72);
        backdrop-filter:blur(8px); position:sticky; top:0; z-index:5 }
  .nav .brand{ font-weight:800; letter-spacing:.16em; font-size:15px }
  .nav a{ color:var(--muted); font-size:13px; text-decoration:none }
  .nav a.on{ color:var(--text) }
  .nav .right{ margin-left:auto; display:flex; align-items:center; gap:12px; font-size:13px; color:var(--muted) }
  .avatar{ width:32px;height:32px;border-radius:50%;background:var(--card-hi); border:1px solid var(--line);
           display:grid; place-items:center; color:var(--cyan); font-weight:700; font-size:13px }
  .bell{ position:relative; font-size:15px }
  .bell i{ position:absolute; top:-6px; right:-8px; background:var(--red); color:#fff; font-size:9px; font-style:normal;
           font-weight:800; border-radius:99px; padding:1px 5px }
  footer{ display:flex; gap:14px; align-items:center; justify-content:space-between;
          padding:18px 26px; color:var(--muted); font-size:12px; flex-wrap:wrap }
  .dot{ width:8px;height:8px;border-radius:50%; display:inline-block; margin-right:7px }
  .gamenote{ text-align:center; font-size:11px; color:#6c7590; margin-top:12px }

  #toasts{ position:fixed; right:18px; bottom:18px; z-index:40; display:flex; flex-direction:column; gap:10px }
  .toast{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px;
          font-size:12px; color:var(--muted); box-shadow:0 10px 30px rgba(0,0,0,.4); max-width:280px;
          animation:toastin .4s ease, toastout .5s ease 5.2s forwards }
  .toast b{ color:var(--text) }
  @keyframes toastin{ from{ transform:translateY(16px); opacity:0 } }
  @keyframes toastout{ to{ transform:translateX(40px); opacity:0 } }

  #chat{ position:fixed; left:18px; bottom:18px; z-index:40; display:none; align-items:center; gap:10px;
         background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 16px 9px 10px;
         font-size:12px; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.4) }
  #chat .av{ width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#39d6ff,#a06bff) }
  #chat .typing{ color:var(--muted) }

  .wrap{ max-width:1100px; margin:0 auto; padding:36px 20px 10px; animation:pagein .45s ease }
  @keyframes pagein{ from{ opacity:0; transform:translateY(6px) } }
  .center{ text-align:center }
  h1{ font-size:clamp(28px,4vw,40px); letter-spacing:-.02em }
  h2{ font-size:clamp(20px,2.6vw,28px); letter-spacing:-.01em }
  .sub{ color:var(--muted); font-size:14px; margin-top:10px }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px }

  .logo{ font-size:clamp(34px,6vw,54px); font-weight:800; letter-spacing:.3em; text-align:center }
  .login{ max-width:430px; margin:26px auto 0; padding:28px }
  label{ display:block; font-size:12px; color:var(--muted); margin:16px 0 7px }
  input{ width:100%; padding:12px 14px; border-radius:10px; font-size:15px; background:var(--field);
         border:1px solid var(--line); color:var(--text); font-family:inherit; outline:none }
  input:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(57,214,255,.15) }
  .row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:12px; color:var(--muted) }
  .link{ color:var(--cyan); cursor:pointer }
  .check{ width:15px;height:15px;border-radius:4px;background:var(--cyan);display:inline-block;vertical-align:-3px;margin-right:8px;cursor:pointer }
  .btn{ display:block; width:100%; margin-top:20px; padding:14px; border:0; border-radius:999px;
        background:var(--card-hi); color:var(--text); font:inherit; font-weight:700; font-size:15px;
        cursor:pointer; animation:pulse 3.4s ease-in-out infinite }
  .btn:hover{ background:#242e47 }
  .btn:disabled{ opacity:.7; cursor:wait }
  .btn.ghost{ animation:none; background:var(--field); border:1px solid var(--line); font-weight:600; font-size:13px; margin-top:0 }
  .split{ display:flex; align-items:center; gap:12px; margin:20px 0 14px; color:var(--muted); font-size:12px }
  .split::before,.split::after{ content:""; flex:1; height:1px; background:var(--line) }
  .sso{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .err{ margin-top:14px; font-size:13px; font-weight:700; color:var(--red); line-height:1.5 }
  .err.soft{ color:var(--muted); font-weight:500 }
  .meta{ margin-top:8px; font-size:12px; color:var(--muted) }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.25); border-top-color:#fff;
         border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:8px }
  .activity{ max-width:430px; margin:16px auto 0; font-size:12px; color:var(--muted); display:flex; justify-content:space-between }

  .toggle{ margin:22px auto 0; width:250px; display:grid; grid-template-columns:1fr 1fr;
           background:var(--field); border-radius:999px; padding:4px; font-size:13px }
  .toggle div{ padding:8px; border-radius:999px; text-align:center; cursor:pointer; color:var(--muted) }
  .toggle div.on{ background:var(--card-hi); color:var(--text); font-weight:700 }
  .plans{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:34px; margin-top:38px; align-items:start }
  .plan{ padding:28px; border-radius:20px; cursor:pointer; transition:transform .15s ease; text-align:left }
  .plan:hover{ transform:translateY(-4px) }
  .plus-card{ box-shadow:0 0 22px rgba(57,214,255,.28), 0 0 60px rgba(57,214,255,.12) }
  .free-card{ opacity:.45; filter:grayscale(.6) }
  .free-card:hover{ transform:none }
  .plan .name{ font-weight:800; font-size:15px; letter-spacing:.02em }
  .plan .price{ font-size:40px; font-weight:800; margin-top:14px; letter-spacing:-.03em }
  .plan .was{ text-decoration:line-through; color:var(--muted); font-size:14px; margin-left:8px; font-weight:500 }
  .plan .per{ color:var(--muted); font-size:13px; margin-top:4px }
  .plan ul{ list-style:none; margin:22px 0 0; border-top:1px solid var(--line); padding-top:20px }
  .plan li{ font-size:14px; margin-bottom:12px }
  .plan li span{ color:var(--green); font-weight:800; margin-right:9px }
  .plan li.no span{ color:var(--muted) }
  .badge{ float:right; background:var(--card-hi); color:var(--gold); font-size:11px; font-weight:800;
          padding:6px 12px; border-radius:999px; letter-spacing:.06em }
  .viewers{ font-size:11px; color:var(--red); margin-top:10px }
  .note{ text-align:center; color:var(--muted); font-size:14px; margin-top:26px }
  .bump{ text-align:center; color:var(--gold); font-size:12px; margin-top:14px }
  .trust{ margin-top:46px; text-align:center; color:var(--muted); font-size:11px; letter-spacing:.12em }
  .logos{ display:flex; flex-wrap:wrap; justify-content:center; gap:26px; margin-top:14px; color:var(--muted);
          font-weight:800; font-size:14px; opacity:.7 }
  .reviews{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:34px }
  .review{ padding:18px; font-size:13px; color:var(--muted); line-height:1.5 }
  .review .stars{ color:var(--gold); letter-spacing:2px; margin-bottom:6px }
  .review b{ color:var(--text); display:block; margin-top:8px; font-size:12px }

  .cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:24px; margin-top:30px }
  .cols .card{ padding:26px }
  .li{ display:flex; justify-content:space-between; font-size:14px; margin-top:16px; color:var(--muted) }
  .li b{ color:var(--text); font-weight:500 }
  .total{ display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--line);
          margin-top:20px; padding-top:18px; font-weight:800 }
  .total span:last-child{ font-size:22px; color:var(--gold) }
  .tiny{ color:var(--muted); font-size:12px; margin-top:12px; line-height:1.6 }
  .lock{ font-size:12px; color:var(--gold); margin-top:10px; font-weight:700 }
  .promo-row{ display:flex; gap:8px; margin-top:16px }
  .promo-row input{ font-size:13px; padding:10px 12px }
  .promo-row button{ padding:0 16px; border-radius:10px; border:1px solid var(--line); background:var(--field);
                     color:var(--text); font:inherit; font-size:13px; cursor:pointer }
  .creditcard{ margin-top:18px; padding:18px; border-radius:14px; background:var(--field); border:1px solid var(--cyan) }
  .creditcard .top{ display:flex; justify-content:space-between; align-items:center; color:var(--cyan); font-weight:800 }
  .creditcard .num{ font-family:var(--mono); font-size:17px; margin-top:12px; letter-spacing:.08em }

  .mid{ min-height:70vh; display:grid; place-content:center; text-align:center; gap:14px }
  .bar{ width:min(440px,80vw); height:12px; border-radius:99px; background:var(--field); overflow:hidden; margin:8px auto }
  .bar i{ display:block; height:100%; width:4%; background:linear-gradient(90deg,var(--cyan),#a06bff); transition:width .5s ease }
  .tick{ width:96px;height:96px;border-radius:50%;margin:0 auto 6px; display:grid; place-items:center;
         font-size:44px; color:var(--green); background:var(--card);
         box-shadow:0 0 26px rgba(60,230,143,.5), 0 0 70px rgba(60,230,143,.22) }
  .receipt{ width:min(440px,88vw); margin:22px auto 0; padding:20px 22px }
  .share{ display:flex; gap:10px; justify-content:center; margin-top:16px }
  .share span{ font-size:12px; color:var(--muted); border:1px solid var(--line); padding:6px 12px; border-radius:999px }
  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:20 }

  #hack{ position:fixed; inset:0; z-index:50; background:#000; display:none; overflow:hidden; cursor:crosshair }
  #rain{ position:absolute; inset:0 }
  #scan{ position:absolute; inset:0; pointer-events:none; z-index:60;
         background:repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px) }
  #rec{ position:absolute; top:16px; right:22px; z-index:61; font-family:var(--mono); color:#ff2d55; font-size:13px; letter-spacing:.1em }
  #rec i{ display:inline-block; width:10px; height:10px; border-radius:50%; background:#ff2d55; margin-right:8px; animation:blink 1s steps(1) infinite }
  #hud{ position:absolute; top:16px; left:22px; z-index:61; font-family:var(--mono); color:#1fbf5c; font-size:11px; line-height:1.7; white-space:pre }
  .term{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
         width:min(1000px,94vw); height:min(660px,80vh); background:rgba(2,6,4,.94);
         border:1px solid #1fbf5c; border-radius:8px; box-shadow:0 0 44px rgba(31,191,92,.35);
         display:flex; flex-direction:column; overflow:hidden; z-index:52 }
  .term .bar2{ display:flex; align-items:center; gap:8px; padding:9px 14px; background:#04120a; border-bottom:1px solid #0c7a34 }
  .term .bar2 i{ width:11px;height:11px;border-radius:50% }
  .term .bar2 p{ flex:1; text-align:center; font-family:var(--mono); font-size:12px; color:#1fbf5c }
  .term pre{ flex:1; margin:0; padding:14px 18px; overflow:hidden; white-space:pre-wrap; word-break:break-word;
             font-family:var(--mono); font-size:clamp(10px,1.35vw,13.5px); line-height:1.6; color:#1fbf5c }
  .term pre b{ color:#7dffb0; font-weight:400 }
  .term pre u{ color:#ff5f56; text-decoration:none }
  .term pre s{ color:#ffd34d; text-decoration:none }
  .term pre em{ color:#0c7a34; font-style:normal }
  .win{ position:absolute; z-index:55; min-width:150px; max-width:min(300px,60vw);
        background:rgba(2,10,5,.94); border:1px solid #1fbf5c; border-radius:5px;
        box-shadow:0 0 22px rgba(31,191,92,.35); font-family:var(--mono); font-size:11px; color:#7dffb0 }
  .win.red{ border-color:#ff2d55; color:#ff8098; box-shadow:0 0 22px rgba(255,45,85,.4) }
  .win.gold{ border-color:#ffcc4d; color:#ffd97a; box-shadow:0 0 22px rgba(255,204,77,.35) }
  .win.white{ border-color:#ddd; color:#eee; background:rgba(20,20,20,.96) }
  .win h4{ font-size:10px; font-weight:600; letter-spacing:.08em; padding:4px 8px;
           background:rgba(255,255,255,.07); display:flex; justify-content:space-between; gap:10px }
  .win .body{ padding:8px 10px; line-height:1.5; white-space:pre-wrap }
  .win .mini{ height:6px; background:#04120a; border:1px solid currentColor; margin-top:7px }
  .win .mini i{ display:block; height:100%; background:currentColor; width:0; animation:fillup 2.2s linear forwards }
  @keyframes fillup{ to{ width:100% } }
  .blink{ animation:blink .18s steps(1) infinite }
  @keyframes blink{ 50%{ opacity:.15 } }
  #flash{ position:absolute; inset:0; z-index:58; pointer-events:none; opacity:0 }
  .boom{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center;
         background:rgba(0,0,0,.88); padding:30px 10px; display:none; z-index:59 }
  .boom h3{ font-family:var(--mono); font-size:clamp(26px,7vw,64px); color:#ff2d55; letter-spacing:.05em }
  .boom pre{ font-family:var(--mono); color:#7dffb0; font-size:clamp(7px,1.5vw,12px); line-height:1.15; margin:10px 0 }
  .boom p{ font-family:var(--mono); color:#7dffb0; font-size:clamp(11px,2vw,14px); margin-top:10px }

  #dark{ position:fixed; inset:0; z-index:70; display:none; background:#000; overflow:hidden;
         font-family:"Times New Roman",Georgia,serif; cursor:none }
  #dark .veil{ position:absolute; inset:0; background:radial-gradient(58vmin 58vmin at 50% 44%, rgba(120,0,0,.38), #000 72%) }
  #dark .fog{ position:absolute; inset:-20%; opacity:.35; pointer-events:none;
     background:radial-gradient(40vmin 30vmin at 30% 60%, rgba(90,0,0,.5), transparent 70%),
                radial-gradient(50vmin 35vmin at 70% 40%, rgba(60,0,0,.5), transparent 70%);
     animation:fog 18s ease-in-out infinite alternate }
  @keyframes fog{ to{ transform:translate(6%,-4%) scale(1.15) } }
  #dark .heart{ position:absolute; inset:0;
     background:radial-gradient(48vmin 48vmin at 50% 44%, rgba(255,0,0,.18), transparent 70%);
     animation:beat 1.7s ease-in-out infinite }
  @keyframes beat{ 0%,100%{opacity:.2} 11%{opacity:.9} 23%{opacity:.3} 34%{opacity:.65} }
  #dark .grain{ position:absolute; inset:-40%; opacity:.07; pointer-events:none; mix-blend-mode:screen;
     background-image:repeating-conic-gradient(#fff 0 .0004turn, #000 0 .0011turn);
     animation:grain .11s steps(2) infinite }
  @keyframes grain{ 50%{ transform:translate(-1.5%,1%) } }
  #dark svg#sigil{ position:absolute; left:50%; top:44%; width:min(64vmin,540px); transform:translate(-50%,-50%) scale(.9);
     opacity:0; transition:opacity 2.4s ease, transform 40s linear; filter:drop-shadow(0 0 20px rgba(255,0,20,.7)) }
  #dark svg#sigil.on{ opacity:.92; transform:translate(-50%,-50%) scale(1.12) }
  #dark svg#sigil.invert{ filter:drop-shadow(0 0 30px #fff) brightness(6) }
  .rot{ transform-origin:250px 250px; animation:spin 52s linear infinite }
  .rot.rev{ animation:spin 34s linear infinite reverse }
  .flick{ animation:flick 4.2s steps(2) infinite }
  @keyframes flick{ 0%,95%,100%{opacity:1} 96%{opacity:.2} 97%{opacity:.9} 98.5%{opacity:.1} }
  #dark .words{ position:absolute; left:0; right:0; bottom:9vh; text-align:center; padding:0 6vw }
  #dark .words p{ color:#c81f2b; font-size:clamp(14px,2.5vw,26px); letter-spacing:.18em; margin-top:13px;
     text-shadow:0 0 18px rgba(210,0,25,.85); opacity:0; animation:rise 1.3s ease forwards }
  #dark .words p.small{ font-size:clamp(11px,1.7vw,16px); color:#7d1119; letter-spacing:.12em }
  @keyframes rise{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
  #dark .whisper{ position:absolute; font-size:clamp(9px,1.2vw,13px); color:rgba(120,10,20,.55); letter-spacing:.2em;
     pointer-events:none; animation:whisper 6s ease-in-out forwards }
  @keyframes whisper{ 0%{opacity:0} 20%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
  #dark .clock{ position:absolute; top:6vh; left:0; right:0; text-align:center; font-family:var(--mono);
     color:#7d1119; font-size:clamp(12px,2vw,18px); letter-spacing:.3em }
  #dark .strobe{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none }
  #dark svg#sigil.shake{ animation:shake .09s linear infinite }
  @keyframes shake{ 25%{ margin-left:-6px } 75%{ margin-left:6px } }
  .eye{ position:absolute; width:min(20vmin,170px); height:min(10vmin,86px); opacity:0;
        transition:opacity 4s ease, width 3s ease, height 3s ease; pointer-events:none }
  .eye svg{ width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 22px rgba(180,0,10,.55)) }
  .eye .lidT, .eye .lidB{ transition:transform 4.5s cubic-bezier(.4,0,.3,1) }
  .eye.open{ opacity:.95 }
  .eye.open .lidT{ transform:translateY(-46px) } .eye.open .lidB{ transform:translateY(46px) }
  .eye .pup{ transition:transform .25s ease }

  #bios{ position:fixed; inset:0; z-index:80; display:none; background:#000; color:#c9c9c9;
         font-family:var(--mono); font-size:clamp(11px,1.5vw,15px); padding:4vh 5vw; line-height:1.55; white-space:pre-wrap }
  #bios b{ color:#fff; font-weight:400 }
  #bios u{ color:#ff5f56; text-decoration:none }

<script>
/* ============ the eyes (built once, both the same) ============ */
function eyeSVG(id){ return `<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="iris${id}"><stop offset="0%" stop-color="#7a0a10"/><stop offset="55%" stop-color="#b7141c"/>
    <stop offset="85%" stop-color="#4a0308"/><stop offset="100%" stop-color="#120000"/></radialGradient>
  <clipPath id="clip${id}"><path d="M4 50 C 40 6, 160 6, 196 50 C 160 94, 40 94, 4 50 Z"/></clipPath></defs>
  <path d="M4 50 C 40 6, 160 6, 196 50 C 160 94, 40 94, 4 50 Z" fill="#efe7dd"/>
  <g clip-path="url(#clip${id})">
    <path d="M8 62 C 40 58, 60 70, 74 66 M12 40 C 44 34, 58 30, 80 36 M192 58 C 160 56, 142 66, 126 62 M188 38 C 156 32, 140 30, 122 38" stroke="#c0323a" stroke-width="1.6" fill="none" opacity=".75"/>
    <circle cx="100" cy="50" r="30" fill="url(#iris${id})"/>
    <ellipse class="pup" cx="100" cy="50" rx="9" ry="22" fill="#000"/>
    <circle cx="90" cy="40" r="6" fill="#fff" opacity=".55"/>
    <rect class="lidT" x="-10" y="-46" width="220" height="50" fill="#0a0000"/>
    <rect class="lidB" x="-10" y="96" width="220" height="50" fill="#0a0000"/>
  </g>
  <path d="M4 50 C 40 6, 160 6, 196 50 C 160 94, 40 94, 4 50 Z" fill="none" stroke="#3a0206" stroke-width="3"/></svg>`; }
document.getElementById("eyeL").innerHTML = eyeSVG("L");
document.getElementById("eyeR").innerHTML = eyeSVG("R");

/* ============ state ============ */
const PLUS = 29.99;
const PRO_PRICES = [299.99, 349.99, 429.99, 549.99, 749.99, 1099.99, 1799.99];
const FEE = 9.99, TAX = 0.07, RUSH = 19.99;

let state = { user:"", first:"", last:"", score:0, fastLine:false, attempt:0, charged:0, token:0, skip:false, rush:false, promo:0, act:1, layer:0, deaths:0 };
/* the letters it has taken are gone from everywhere in the game */
const TAKEN = { idx:[], letters:[] };
const holed = (str, off) => str.split("").map((ch,i) => TAKEN.idx.includes(i + off) ? "_" : ch).join("");
const fullName = () => (holed(state.first,0) + " " + holed(state.last,1000)).trim() || handle();
const trueName = () => (state.first + " " + state.last).trim() || handle();
const firstName = () => holed(state.first,0) || handle();
function takeLetter(){
  const pool = [];
  state.first.split("").forEach((ch,i) => { if(/\w/.test(ch) && !TAKEN.idx.includes(i)) pool.push([i, ch]); });
  state.last.split("").forEach((ch,i) => { if(/\w/.test(ch) && !TAKEN.idx.includes(i+1000)) pool.push([i+1000, ch]); });
  if(pool.length <= 2) return null;                 // it always leaves you something to be called
  const [i, ch] = pick(pool); TAKEN.idx.push(i); TAKEN.letters.push(ch.toUpperCase());
  try{ document.title = fullName(); }catch(e){}
  return ch.toUpperCase();
}
/* the moment of taking: everything stops, one letter, no face */
async function taking(why){
  const ch = takeLetter(); if(!ch) return;
  AU.duck(2.4); AU.floorSwell(2.2); await sleep(900);
  SCARE.show(); const c = SCARE.ctx; c.fillStyle = "#000"; c.fillRect(0,0,SCARE.W,SCARE.H);
  c.fillStyle = "#ff2d55"; c.font = `bold ${Math.floor(SCARE.H*.5)}px ui-monospace,Menlo,monospace`; c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(ch, SCARE.W/2, SCARE.H/2 + SCARE.H*.02); c.textBaseline = "alphabetic";
  AU.scream(); await sleep(140); c.fillStyle = "#000"; c.fillRect(0,0,SCARE.W,SCARE.H); await sleep(1100);
  c.fillStyle = "#7dffb0"; c.font = "13px ui-monospace,Menlo,monospace"; c.fillText(why || "it took that.", SCARE.W/2, SCARE.H/2);
  c.fillStyle = "#ff2d55"; c.font = "bold 22px ui-monospace,Menlo,monospace"; c.fillText(fullName().toUpperCase(), SCARE.W/2, SCARE.H/2 + 44);
  AU.whisper(ch.toLowerCase()); await sleep(2600); SCARE.hide();
}
/* a lost round: try again, or let it keep a letter and go on */
function retryPrompt(name){
  return new Promise(res => {
    const r = document.getElementById("retry"); r.style.display = "flex"; state.deaths++;
    document.getElementById("rtitle").textContent = pick(["IT CAUGHT YOU", "NOT FAST ENOUGH", "IT WAS ALREADY THERE", "HOLD STILL"]);
    document.getElementById("rtext").textContent = `${name}. try again and it gets a little easier, or let it keep a letter of ${fullName()} and keep going.`;
    AU.duck(.6); AU.thump();
    document.getElementById("ragain").onclick = () => { r.style.display = "none"; AU.click(); res(true); };
    document.getElementById("rmove").onclick = () => { r.style.display = "none"; AU.click(); res(false); };
  });
}
/* play a round until it's won, or until the player chooses to move on. assist goes up each retry. */
async function playRound(game, name){
  let assist = 0;
  while(true){ const won = await game(assist); if(won) return true;
    if(!(await retryPrompt(name))) return false; assist = Math.min(3, assist + 1); }
}

/* ---- cheat codes: type one of these as the USERNAME and hit Sign in. ---- */
const CHEATS = {
  layer1: () => act2Login(),
  layer2: () => layerTwo(true),

  tick(){ this.tone(1500, "sine", .002, .06, .03); },
  klaxon(on){ if(!on){ if(this.live.klax){ clearInterval(this.live.klax); this.live.klax = null; } return; }
    if(this.live.klax || !this.ok()) return; let hi = false; this.live.klax = setInterval(() => { hi = !hi; this.tone(hi?440:330, "sawtooth", .01, .07, .22); }, 260); },
  hiss(on, level=.05){ if(!this.ok()) return;
    if(!on){ if(this.live.hiss){ const h = this.live.hiss; h.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime+2); setTimeout(() => { try{ h.s.stop(); }catch(e){} }, 2200); this.live.hiss = null; } return; }
    if(this.live.hiss){ this.live.hiss.g.gain.linearRampToValueAtTime(level, this.ctx.currentTime+3); return; }
    const s = this.noise(4); s.loop = true; const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    const g = this.ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(level, this.ctx.currentTime+6);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(); this.live.hiss = {s,g}; },
  drone(on){ if(!this.ok()) return;
    if(!on){ const d = this.live.drone; if(!d) return; d.g.gain.linearRampToValueAtTime(0, this.ctx.currentTime+1.5); setTimeout(() => d.oscs.forEach(o => { try{ o.stop(); }catch(e){} }), 1700); this.live.drone = null; return; }
    if(this.live.drone) return;
    const g = this.ctx.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(.16, this.ctx.currentTime+10);
    const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 180; f.Q.value = 4; f.connect(g); g.connect(this.master);
    const oscs = [[55,"sawtooth",0],[55,"sawtooth",-9],[27.5,"sine",0],[82.4,"triangle",7]].map(([fr,ty,de]) => {
      const o = this.ctx.createOscillator(); o.type = ty; o.frequency.value = fr; o.detune.value = de; o.connect(f); o.start(); return o; });
    this.live.drone = {g, f, oscs}; },
  droneRise(sec){ const d = this.live.drone; if(!d) return; const t = this.ctx.currentTime;
    d.oscs.forEach(o => o.frequency.exponentialRampToValueAtTime(o.frequency.value*2.2, t+sec));
    d.f.frequency.exponentialRampToValueAtTime(1400, t+sec); d.g.gain.linearRampToValueAtTime(.3, t+sec); },
  thump(){ if(this.ok()) this.thumpAt(this.ctx.currentTime); },
  heartbeat(bpm){ if(this.live.heart) clearTimeout(this.live.heart); if(!bpm || !this.ok()){ this.live.bpm = 0; return; }
    const running = !!this.live.bpm; this.live.bpm = bpm;
    const beat = () => { if(!this.live.bpm) return; this.thump(); setTimeout(() => this.thump(), 190); this.live.heart = setTimeout(beat, 60000/this.live.bpm); };
    if(!running) beat(); else this.live.heart = setTimeout(beat, 60000/bpm); },
  bell(){ [65.4,98,130.8,196].forEach((f,i) => this.tone(f, i%2?"triangle":"sine", .01, .25/(i+1), 4.5)); },
  hit(){ if(!this.ok()) return; const t0 = this.ctx.currentTime;
    const n = this.noise(1.2), f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(8000,t0); f.frequency.exponentialRampToValueAtTime(120, t0+1.1); n.connect(f); this.env(f, t0, .003, 1, 1.1); n.start(t0);
    const o = this.ctx.createOscillator(); o.frequency.setValueAtTime(90,t0); o.frequency.exponentialRampToValueAtTime(28,t0+1.4); this.env(o, t0, .003, 1, 1.4); o.start(t0); o.stop(t0+1.6); },
  stopAll(){ this.klaxon(false); this.hiss(false); this.drone(false); this.breath(false); this.ambience(false); this.heartbeat(0); try{ speechSynthesis.cancel(); }catch(e){} }
};

    c:pick(["#ff5f9e","#ffcc4d","#3ce68f","#39d6ff","#a06bff"]), v:2+Math.random()*4, a:Math.random()*6, s:Math.random()*.2-.1 }));
  let frames = 0;
  (function draw(){ ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.y += p.v; p.a += p.s; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(++frames < 200) requestAnimationFrame(draw); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

async function voice(lines, opts={}){
  const hold = opts.hold ?? 1150, v = document.getElementById("void");
  v.style.display = "block"; v.innerHTML = "";
  const bleed = document.getElementById("sigil").cloneNode(true); bleed.removeAttribute("id"); bleed.classList.add("bleed"); bleed.querySelectorAll("[id]").forEach(e => e.removeAttribute("id")); v.appendChild(bleed);

  v.ondblclick = () => { state.fastLine = true; skipAll = true; };

  AU.hiss(true, .045);
  const blinkAlone = async ms => { const d = document.createElement("div"); d.className = "dim"; d.textContent = "▌"; box.appendChild(d);
    const t0 = Date.now(); while(Date.now() - t0 < ms && !skipAll){ d.style.opacity = d.style.opacity === "0" ? "1" : "0"; await sleep(520); } d.remove(); };
  const intrude = async kind => { if(skipAll) return;
    if(kind === "face"){ SCARE.faceFlash(.35); AU.click(); await sleep(60); SCARE.hide(); }
    if(kind === "room"){ await SCARE.flashRoom(rnd(0,2), 80); SCARE.hide(); }
    if(kind === "eye"){ peek.classList.add("on"); await sleep(120); peek.classList.add("open"); AU.tick(); }
    if(kind === "eyeoff"){ peek.classList.remove("open"); await sleep(1800); peek.classList.remove("on"); }
    if(kind === "you"){ const d = document.createElement("div"); d.className = "you"; box.appendChild(d);
      const s = pick(["is anyone there", "hello?", "stop", `${firstName().toLowerCase()} here`, "i didnt type that"]);
      for(let i=0;i<=s.length;i++){ d.textContent = s.slice(0,i) + (i<s.length?"▌":""); AU.click(); await sleep(rnd(70,170)); } await sleep(900); }
    if(kind === "rewrite"){ const last = box.lastElementChild; if(!last) return; const orig = last.textContent;
      for(let i=0;i<8;i++){ last.textContent = glitchStr(orig, .25); await sleep(60); }
      const words = orig.split(" "); words[rnd(0, words.length-1)] = firstName().toUpperCase(); last.textContent = words.join(" "); last.style.color = "#ff2d55"; AU.thump(); await sleep(1200); }
    if(kind === "cut"){ box.style.visibility = "hidden"; bleed.style.visibility = "hidden"; AU.hiss(false); AU.thump(); await sleep(rnd(2200,3600)); box.style.visibility = ""; bleed.style.visibility = ""; AU.hiss(true,.045); }
  };
  SKIP.show(); await sleep(opts.lead ?? 900);
  for(let li=0; li<lines.length && !skipAll; li++){
    state.fastLine = false;
    const [who, text, after] = lines[li];
    if(who === "pause"){ await blinkAlone(text); continue; }
    if(who === "do"){ await intrude(text); continue; }
    const d = document.createElement("div"); d.className = who; box.appendChild(d);
    const body = text.replace(/{name}/g, fullName()).replace(/{first}/g, firstName()).replace(/{time}/g, DREAD.hour());
    if(who === "it" && Math.random() < .5) AU.whisper(body.toLowerCase().slice(0, 40));
    for(let i=0;i<=body.length;i++){ d.textContent = body.slice(0,i) + (i<body.length ? "▌" : "");
      if(who === "sys" && i%3===0) AU.click(); if(who === "it" && i%6===0) AU.tick();
      await tsleep(who === "it" ? 34 : 17); }
    d.textContent = body; if(who === "it") AU.thump();
    if(state.fastLine){ state.fastLine = false; await sleep(300); continue; }
    while(box.childElementCount > 5) box.removeChild(box.firstChild);
    if(after) await intrude(after);
    await sleep(hold);
  }

   find three fuses, then the door. it hunts by light and by sound.
   ================================================================ */
function mazeGame(assist=0){
  state.layer = 6; ARENA.open(); ARENA.silence = false; ARENA.happy = false; ARENA.stalkerOn = false; MUSIC.stop(); AU.floor(true);
  const A = ARENA, MW = 17, MH = 17, g = Array.from({length:MH}, () => Array(MW).fill(1));
  (function carve(x,y){ g[y][x] = 0; for(const [dx,dy] of [[2,0],[-2,0],[0,2],[0,-2]].sort(() => Math.random()-.5)){ const nx = x+dx, ny = y+dy;
    if(nx>0 && ny>0 && nx<MW-1 && ny<MH-1 && g[ny][nx] === 1){ g[y+dy/2][x+dx/2] = 0; carve(nx,ny); } } })(1,1);
  for(let i=0;i<14;i++){ const x = rnd(1,MW-2), y = rnd(1,MH-2); g[y][x] = 0; }
  const EX = [MW-2, MH-2]; g[EX[1]][EX[0]] = 0;
  const open = []; for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++) if(g[y][x] === 0) open.push([x,y]);
  const far = open.filter(([x,y]) => Math.hypot(x-1,y-1) > 6).sort(() => Math.random()-.5), fuses = [];
  for(const [x,y] of far){ if(fuses.length < 3 && fuses.every(f => Math.hypot(f.x-x-.5, f.y-y-.5) > 5) && !(x === EX[0] && y === EX[1])) fuses.push({x:x+.5, y:y+.5, got:false}); }
  while(fuses.length < 3){ const [x,y] = pick(far); fuses.push({x:x+.5, y:y+.5, got:false}); }
  const P = {x:1.5, y:1.5, a: g[1][2] === 0 ? 0 : Math.PI/2}, Mo = {x:MW-1.5, y:1.5, hunt:0, path:[], pt:0, tgt:null, st:0};
  const solid = (x,y) => { const gx = x|0, gy = y|0; return gy<0||gx<0||gy>=MH||gx>=MW||g[gy][gx] === 1; };
  const bfs = (sx,sy,tx,ty) => { const prev = new Map(), key = (x,y) => y*MW+x, q = [[sx,sy]]; prev.set(key(sx,sy), null);
    while(q.length){ const [x,y] = q.shift(); if(x===tx && y===ty) break; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x+dx, ny = y+dy; if(solid(nx+.5,ny+.5) || prev.has(key(nx,ny))) continue; prev.set(key(nx,ny), [x,y]); q.push([nx,ny]); } }
    const path = []; let cur = [tx,ty]; if(!prev.has(key(tx,ty))) return path; while(cur){ path.unshift(cur); cur = prev.get(key(cur[0],cur[1])); } return path.slice(1); };
  const los = () => { const dx = P.x-Mo.x, dy = P.y-Mo.y, d = Math.hypot(dx,dy), n = Math.ceil(d*8); for(let i=1;i<n;i++) if(solid(Mo.x+dx*i/n, Mo.y+dy*i/n)) return false; return true; };
  const keys = {}, kd = e => { const k = e.key.toLowerCase(); keys[k] = true; if(k === "f" || k === " ") toggle = true; if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault(); }, ku = e => { keys[e.key.toLowerCase()] = false; };
  addEventListener("keydown", kd); addEventListener("keyup", ku);
  let secs = 0, bat = 100, fl = true, flick = 1, fT = 0, got = 0, stepT = 0, caught = 0, escaped = 0, toggle = false;
  const RW = 180, FOV = 1.1, zb = new Float32Array(RW), side = new Uint8Array(RW), cellv = new Uint8Array(RW);
  return A.run((dt, clicked) => {
    const c = A.c, W = A.W, H = A.H; secs += dt; stepT -= dt;
    const tz = A.down ? (A.mx < W*.3 ? [-1,0] : A.mx > W*.7 ? [1,0] : A.my < H*.3 ? [0,0] : [0,1]) : [0,0];
    if(clicked && A.my < H*.3) toggle = true;
    const fwd = (keys.w||keys.arrowup ? 1 : 0) - (keys.s||keys.arrowdown ? 1 : 0) + tz[1], turn = (keys.d||keys.arrowright ? 1 : 0) - (keys.a||keys.arrowleft ? 1 : 0) + tz[0], sprint = keys.shift;
    if(!caught && !escaped){
      if(toggle){ toggle = false; if(bat > 3 || fl){ fl = !fl; AU.click(); } }
      P.a += turn * 2.2 * dt; const spd = (sprint ? 3.6 : 2.3) * (fwd < 0 ? .6 : 1);
      if(fwd){ const nx = P.x + Math.cos(P.a)*fwd*spd*dt, ny = P.y + Math.sin(P.a)*fwd*spd*dt, r = .2;
        if(!solid(nx-r,P.y-r) && !solid(nx+r,P.y-r) && !solid(nx-r,P.y+r) && !solid(nx+r,P.y+r)) P.x = nx;
        if(!solid(P.x-r,ny-r) && !solid(P.x+r,ny-r) && !solid(P.x-r,ny+r) && !solid(P.x+r,ny+r)) P.y = ny;
        if(stepT <= 0){ stepT = sprint ? .28 : .45; AU.noiseAt(AU.ctx ? AU.ctx.currentTime : 0, .08, "lowpass", 400, sprint ? .2 : .1, .002, .07); } }
      for(const f of fuses) if(!f.got && Math.hypot(P.x-f.x, P.y-f.y) < .6){ f.got = true; got++; AU.chord(); A.flash("#7dffb0", .18); A.banner(got < 3 ? `FUSE ${got}/3` : "ALL FUSES — THE DOOR IS LIVE", "#7dffb0", true); Mo.hunt = Math.max(Mo.hunt, 2); Mo.tgt = [P.x|0, P.y|0]; }
      if(got === 3 && Math.hypot(P.x-EX[0]-.5, P.y-EX[1]-.5) < .6){ escaped = 1; AU.door(); }
      bat = Math.max(0, Math.min(100, bat + (fl ? -1.4 : 6) * dt)); if(bat <= 0 && fl){ fl = false; A.banner("THE BATTERY DIED", "#ff2d55"); }
      const d = Math.hypot(P.x-Mo.x, P.y-Mo.y), moving = fwd !== 0, noise = moving ? (sprint ? 7 : 2.6) : 1;
      const sees = los() && d < (fl ? 9 : 1.8), hears = d < noise;
      if(sees || hears){ if(Mo.hunt <= 0){ AU.shriek(); AU.duck(.25); } Mo.hunt = 5; Mo.tgt = [P.x|0, P.y|0]; } else Mo.hunt = Math.max(0, Mo.hunt - dt);
      Mo.pt -= dt; if(Mo.pt <= 0){ Mo.pt = .35; if(Mo.hunt > 0 && sees) Mo.tgt = [P.x|0, P.y|0];
        if(!Mo.tgt || ((Mo.x|0) === Mo.tgt[0] && (Mo.y|0) === Mo.tgt[1])){ const o = pick(open); Mo.tgt = [o[0], o[1]]; }
        Mo.path = bfs(Mo.x|0, Mo.y|0, Mo.tgt[0], Mo.tgt[1]); }
      const ms = Mo.hunt > 0 ? 2.25 + secs*.004 - assist*.25 : 1.05;
      if(Mo.path.length){ const [tx,ty] = Mo.path[0], dx = tx+.5-Mo.x, dy = ty+.5-Mo.y, dd = Math.hypot(dx,dy); if(dd < .08) Mo.path.shift(); else { Mo.x += dx/dd*ms*dt; Mo.y += dy/dd*ms*dt; } }
      Mo.st += dt; if(Mo.st > (Mo.hunt > 0 ? .32 : .8) && d < 10){ Mo.st = 0; const ang = Math.atan2(Mo.y-P.y, Mo.x-P.x) - P.a; AU.knock(Math.max(-1, Math.min(1, Math.sin(ang))), 1, true); }
      if(d < 2.2) AU.breath(true); else if(d > 4) AU.breath(false);
      AU.heartbeat(d < 8 ? 55 + (8-d)*14 : 0);
      if(d < .5){ caught = 1; AU.breath(false); AU.duck(.4); AU.scream(); AU.stinger(); A.shake = 20; }
    }
    /* ---- raycast ---- */
    for(let col=0; col<RW; col++){ const ra = P.a - FOV/2 + col/RW*FOV, rx = Math.cos(ra), ry = Math.sin(ra);
      let mx = P.x|0, my = P.y|0; const ddx = Math.abs(1/(rx||1e-9)), ddy = Math.abs(1/(ry||1e-9));
      let sx = rx < 0 ? (P.x-mx)*ddx : (mx+1-P.x)*ddx, sy = ry < 0 ? (P.y-my)*ddy : (my+1-P.y)*ddy, sd = 0, hit = false, n = 0;
      while(!hit && n++ < 40){ if(sx < sy){ sx += ddx; mx += rx < 0 ? -1 : 1; sd = 0; } else { sy += ddy; my += ry < 0 ? -1 : 1; sd = 1; } if(solid(mx+.5, my+.5)) hit = true; }
      zb[col] = Math.max(.05, (sd === 0 ? sx-ddx : sy-ddy) * Math.cos(ra - P.a)); side[col] = sd; }
    fT -= dt; if(fT <= 0){ fT = .04 + Math.random()*.2; flick = Math.random() < (bat < 30 ? .35 : .06) ? .4 + Math.random()*.5 : 1; }
    const R = fl ? (3.2 + bat/100*4.5) * flick : 1.0, cw = W/RW;
    c.fillStyle = "#000"; c.fillRect(0,0,W,H);
    const fg = c.createLinearGradient(0,H/2,0,H); fg.addColorStop(0,"#000"); fg.addColorStop(1, fl ? "#15100c" : "#060404"); c.fillStyle = fg; c.fillRect(0,H/2,W,H/2);
    for(let col=0; col<RW; col++){ const d = zb[col], h = H/d, s = Math.pow(Math.max(0, 1 - d/R), 1.35) * (side[col] ? .7 : 1) * (1 - Math.abs(col-RW/2)/(RW/2)*.35);
      c.fillStyle = `rgb(${110*s|0},${92*s|0},${78*s|0})`; c.fillRect(col*cw, H/2-h/2, cw+1, h); }
    const proj = (x,y) => { const dx = x-P.x, dy = y-P.y, d = Math.hypot(dx,dy); let rel = Math.atan2(dy,dx) - P.a; while(rel > Math.PI) rel -= 6.283; while(rel < -Math.PI) rel += 6.283;
      const col = RW/2*(1 + Math.tan(rel)/Math.tan(FOV/2)); return {d, sx: col*cw, ok: Math.abs(rel) < FOV/2 + .15 && col >= 0 && col < RW && zb[col|0] > d - .25}; };
    for(const f of fuses){ if(f.got) continue; const p = proj(f.x, f.y); if(!p.ok) continue; const sz = H/p.d*.12, y = H/2 + H/p.d*.25;
      const gg = c.createRadialGradient(p.sx,y,1,p.sx,y,sz*3); gg.addColorStop(0,"rgba(125,255,176,.9)"); gg.addColorStop(1,"rgba(125,255,176,0)"); c.fillStyle = gg; c.fillRect(p.sx-sz*3, y-sz*3, sz*6, sz*6);
      c.fillStyle = "#eafff0"; c.fillRect(p.sx-sz*.25, y-sz*.5, sz*.5, sz); }
    { const p = proj(EX[0]+.5, EX[1]+.5); if(p.ok){ const sz = H/p.d; c.fillStyle = got === 3 ? `rgba(60,230,143,${.55+Math.sin(secs*5)*.2})` : "rgba(130,20,30,.55)"; c.fillRect(p.sx-sz*.18, H/2-sz*.4, sz*.36, sz*.9); } }
    { const p = proj(Mo.x, Mo.y); if(p.ok && p.d > .2){ const h = H/p.d*.95, w = h*.13, fy = H/2 + H/p.d/2, ty = fy - h, vis = Math.max(0, 1 - p.d/(R+1.2));
        if(vis > .05){ const v = vis*170; c.fillStyle = `rgb(${v*.5|0},${v*.45|0},${v*.4|0})`; c.fillRect(p.sx-w/2, ty+h*.14, w, h*.86);
          c.fillRect(p.sx-w*1.6, ty+h*.2, w*.4, h*.6); c.fillRect(p.sx+w*1.2, ty+h*.2, w*.4, h*.6);
          c.fillStyle = `rgb(${v*1.1|0},${v|0},${v*.9|0})`; c.beginPath(); c.ellipse(p.sx, ty+h*.08, w*.9, h*.075, 0, 0, 7); c.fill();
          c.fillStyle = "#200"; c.beginPath(); c.ellipse(p.sx, ty+h*.12, w*.35, h*(p.d < 3 ? .03 : .01), 0, 0, 7); c.fill(); }
        if(Mo.hunt > 0 || p.d < R+3){ const e = Math.max(2, h*.012); c.fillStyle = "rgba(235,228,214,.9)"; c.fillRect(p.sx-w*.45, ty+h*.065, e*1.6, e); c.fillRect(p.sx+w*.2, ty+h*.065, e*1.6, e); } } }
    c.fillStyle = "rgba(0,0,0,.25)"; for(let y=0; y<H; y+=3) c.fillRect(0,y,W,1);
    if(caught){ caught += dt; c.fillStyle = `rgba(0,0,0,${Math.min(1, caught*1.2)})`; c.fillRect(0,0,W,H); }
    if(escaped){ escaped += dt; c.fillStyle = `rgba(20,190,90,${Math.min(1, escaped*.8)})`; c.fillRect(0,0,W,H); }
    c.fillStyle = "#111"; c.fillRect(W/2-70, H-28, 140, 8); c.fillStyle = bat < 25 ? "#ff2d55" : "#ffd97a"; c.fillRect(W/2-70, H-28, 140*bat/100, 8);
    c.font = "11px ui-monospace,Menlo,monospace"; c.textAlign = "center"; c.fillStyle = "#8a8a70"; c.fillText(fl ? "LIGHT ON — it can see the light" : "LIGHT OFF — hold still, it's recharging", W/2, H-36);
    if(secs < 9){ c.fillStyle = "#7dffb0"; c.font = "bold 13px ui-monospace,Menlo,monospace"; c.fillText("W A S D · SHIFT sprint (loud) · F light · find 3 green fuses, then the door", W/2, H*.82); }
    const d0 = Math.hypot(P.x-Mo.x, P.y-Mo.y);
    A.hud("THE BASEMENT — hide in the dark", `FUSES ${got}/3`, Math.max(0, 100 - (Mo.hunt > 0 ? 60 : 0) - Math.max(0, (5-d0))*8), Mo.hunt > 0 ? "IT SEES YOU" : (d0 < 4 ? "it is close" : ""));
    if(caught > 1.2){ removeEventListener("keydown", kd); removeEventListener("keyup", ku); SCARE.faceFlash(1); setTimeout(() => SCARE.hide(), 700); return {done:true, win:false}; }
    if(escaped > 1.4){ removeEventListener("keydown", kd); removeEventListener("keyup", ku); state.score += 25; return {done:true, win:true}; }
  }).then(w => { ARENA.close(); AU.breath(false); removeEventListener("keydown", kd); removeEventListener("keyup", ku); return w; });
}

async function basement(){

    ["sys","...it's real. there's a way out. it needs three fuses. it hunts the light and it hunts sound. turn the light off and it can't see you — but you can't see either."]], {end:"none"});
  if(!alive(t)) return;
  const won = await playRound(mazeGame, "it caught you in the basement");

}
