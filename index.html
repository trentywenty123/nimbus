<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIMBUS — The Archive</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:none;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
   NIMBUS — THE ARCHIVE
   An original horror game in five levels. Everything is drawn and
   synthesized in this file. No network, no storage, no tracking.
   Your name is typed into an in-game guestbook and stays in this tab.

   Level 1  THE THREAD    click the threads before they are deleted
   Level 2  THE PAGE      break the rot, 1997 style
   Level 3  THE HALL      stealth: hold to move, release to hold your breath
   Level 4  THE NAME      dodge the letters
   Level 5  THE BASEMENT  first person: find 3 fuses, hide in the dark

   Controls: mouse / touch. Basement: W A S D or arrows, SHIFT sprint,
   F / SPACE / click toggles the flashlight.
   On the title screen press C to toggle CALM MODE (no flashes or shake).
   Jump to a level: add #1 .. #5 to the URL.
   ===================================================================== */
const cv = document.getElementById("c"), c = cv.getContext("2d");
let W = 0, H = 0;
function fit(){ const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d; c.setTransform(d,0,0,d,0,0); }
addEventListener("resize", fit); fit();

const rnd = (a,b) => a + Math.random()*(b-a), ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[ri(0,a.length-1)], clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (a,b,x,y) => Math.hypot(a-x, b-y);
const MONO = "ui-monospace,Menlo,Consolas,'Courier New',monospace";
function txt(s,x,y,size=14,col="#fff",al="left",weight=""){
  c.font = `${weight} ${size}px ${MONO}`; c.textAlign = al; c.fillStyle = col; c.fillText(s,x,y); }

/* ------------------------------------------------------------ input */
const M = {x:innerWidth/2, y:innerHeight/2, down:false, click:false}, K = {}, keyq = [];
cv.addEventListener("pointermove", e => { M.x = e.clientX; M.y = e.clientY; });
cv.addEventListener("pointerdown", e => { AU.start(); M.x = e.clientX; M.y = e.clientY; M.down = true; M.click = true; });
addEventListener("pointerup", () => { M.down = false; });
addEventListener("keydown", e => { AU.start(); const k = e.key.toLowerCase(); K[k] = true; keyq.push(e.key);
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) e.preventDefault(); });
addEventListener("keyup", e => { K[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for(const k in K) K[k] = false; M.down = false; });

/* ------------------------------------------------------------ audio */
const AU = {
  x:null, m:null, drn:null, hb:0, hbT:null,
  start(){ if(this.x){ if(this.x.state === "suspended") this.x.resume(); return; }
    try{ this.x = new (window.AudioContext || window.webkitAudioContext)(); this.m = this.x.createGain(); this.m.gain.value = .7; this.m.connect(this.x.destination); }catch(e){ this.x = null; } },
  tone(f,type="sine",dur=.2,vol=.1,to=0,delay=0){ if(!this.x) return; const t = this.x.currentTime+delay, o = this.x.createOscillator(), g = this.x.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.m); o.start(t); o.stop(t+dur+.05); },
  noise(dur=.2,vol=.2,freq=1200,type="bandpass"){ if(!this.x) return; const n = this.x.sampleRate*dur, b = this.x.createBuffer(1,n,this.x.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1; const s = this.x.createBufferSource(), f = this.x.createBiquadFilter(), g = this.x.createGain(), t = this.x.currentTime;
    s.buffer = b; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(this.m); s.start(t); },
  thump(v=.5){ this.tone(80,"sine",.3,v,34); },
  hit(){ this.noise(.9,.5,500,"lowpass"); this.tone(90,"sine",1,.6,26); },
  blip(n=0){ this.tone(Math.min(2200,520*Math.pow(1.06,n*2)),"square",.07,.05); },
  tick(){ this.tone(1500,"sine",.03,.04); },
  chord(){ [523,659,784].forEach((f,i) => this.tone(f,"triangle",.4,.08,0,i*.05)); },
  stinger(){ [110,116,123,220,233].forEach(f => this.tone(f,"sawtooth",1.1,.06)); setTimeout(() => { this.noise(.6,.5,700,"lowpass"); this.thump(.8); }, 380); },
  shriek(){ this.tone(1800,"sawtooth",.9,.08,420); },
  creak(){ this.tone(700,"sawtooth",1,.03,380); },
  knock(n=3){ for(let i=0;i<n;i++) setTimeout(() => { this.tone(120,"sine",.25,.5,40); this.noise(.06,.2,500,"lowpass"); }, i*430); },
  step(){ this.noise(.07,.1,380,"lowpass"); },
  drone(on){ if(!this.x) return; if(!on){ if(this.drn){ const d = this.drn; d.g.gain.linearRampToValueAtTime(0,this.x.currentTime+1.5); setTimeout(() => d.o.forEach(o => { try{ o.stop(); }catch(e){} }),1700); this.drn = null; } return; }
    if(this.drn) return; const g = this.x.createGain(), f = this.x.createBiquadFilter(); g.gain.value = 0; g.gain.linearRampToValueAtTime(.12,this.x.currentTime+4);
    f.type = "lowpass"; f.frequency.value = 160; f.connect(g); g.connect(this.m);
    const o = [[55,"sawtooth"],[55.7,"sawtooth"],[27.5,"sine"],[82.4,"triangle"]].map(([fr,t]) => { const q = this.x.createOscillator(); q.type = t; q.frequency.value = fr; q.connect(f); q.start(); return q; });
    this.drn = {o,g}; },
  heart(bpm){ clearTimeout(this.hbT); this.hb = bpm; if(!bpm) return;
    const beat = () => { if(!this.hb) return; this.thump(.35); setTimeout(() => this.thump(.25),190); this.hbT = setTimeout(beat,60000/this.hb); }; beat(); },
  duck(sec=.8){ if(!this.x) return; const g = this.m.gain, t = this.x.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
    g.linearRampToValueAtTime(.02,t+.1); g.setValueAtTime(.02,t+sec); g.linearRampToValueAtTime(.7,t+sec+.2); },
  whisper(s){ try{ const u = new SpeechSynthesisUtterance(s); u.pitch = .1; u.rate = .55; u.volume = .6; speechSynthesis.speak(u); }catch(e){} },
  stop(){ this.heart(0); this.drone(false); try{ speechSynthesis.cancel(); }catch(e){} }
};

/* ------------------------------------------------------------ effects */
const FX = {shake:0, flash:0, fc:"#fff", calm:false, parts:[], pops:[], dread:0};
const shake = n => { if(!FX.calm) FX.shake = Math.max(FX.shake,n); };
const flash = (col,a) => { if(!FX.calm){ FX.fc = col; FX.flash = a; } };
const burst = (x,y,col,n=10,sp=4) => { for(let i=0;i<n;i++){ const a = rnd(0,6.28), v = sp*rnd(.4,1.2); FX.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,m:.6,c:col}); } };
const pop = (t,x,y,col="#7dffb0",s=16) => FX.pops.push({t,x,y,c:col,s,l:1});
function drawFX(dt){
  FX.parts = FX.parts.filter(p => (p.l -= dt) > 0);
  for(const p of FX.parts){ p.x += p.vx*dt*60; p.y += p.vy*dt*60; p.vy += .05*dt*60; c.globalAlpha = p.l/p.m; c.fillStyle = p.c; c.fillRect(p.x,p.y,3,3); }
  c.globalAlpha = 1;
  FX.pops = FX.pops.filter(p => (p.l -= dt) > 0);
  for(const p of FX.pops){ p.y -= 36*dt; c.globalAlpha = Math.min(1,p.l*2); txt(p.t,p.x,p.y,p.s,p.c,"center","bold"); } c.globalAlpha = 1;
  if(FX.flash > 0){ c.globalAlpha = FX.flash; c.fillStyle = FX.fc; c.fillRect(0,0,W,H); c.globalAlpha = 1; FX.flash = Math.max(0,FX.flash-dt*3); }
  const g = c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,`rgba(${Math.round(FX.dread*90)},0,0,${.55+FX.dread*.3})`); c.fillStyle = g; c.fillRect(0,0,W,H);
}

/* ------------------------------------------------------------ game state */
const G = {name:"", taken:[], deaths:0, lvl:0, ld:{}, score:0, held:0};
const shown = () => (G.name || "Guest").split("").map((ch,i) => G.taken.includes(i) ? "_" : ch).join("");
const first = () => shown().split(" ")[0];
function takeLetter(){ const n = G.name || "Guest", pool = []; for(let i=0;i<n.length;i++) if(/\w/.test(n[i]) && !G.taken.includes(i)) pool.push(i);
  if(pool.length > 2){ G.taken.push(pick(pool)); return true; } return false; }
const VICTIMS = [["Marisol Reyes",2019,41],["Aaron Voss",2021,12],["D. Pearl",2022,29],["Priya Raman",2023,47],["K. Lindqvist",2025,52]];

let scene = null; const go = s => { scene = s; };
let last = performance.now();
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now;
  c.save(); if(FX.shake > 0){ c.translate(rnd(-1,1)*FX.shake,rnd(-1,1)*FX.shake); FX.shake = Math.max(0,FX.shake-dt*30); }
  if(scene) scene(dt); drawFX(dt); c.restore();
  M.click = false; keyq.length = 0; requestAnimationFrame(frame);
}

/* ------------------------------------------------------------ shared drawing */
function hud(title,right,hp,sub){
  c.fillStyle = "rgba(0,0,0,.65)"; c.fillRect(0,0,W,56); txt(title,16,22,12,"#7dffb0");
  const bw = Math.min(300,W*.4); c.fillStyle = "#1a0a0e"; c.fillRect(16,32,bw,9);
  c.fillStyle = hp < 35 ? "#ff2d55" : "#3ce68f"; c.fillRect(16,32,bw*clamp(hp,0,100)/100,9);
  txt(right,W-16,28,20,"#e7ffe9","right","bold"); if(sub) txt(sub,W-16,46,11,"#7dffb0","right");
}
function pointer(col="#7dffb0"){ c.save(); c.fillStyle = col; c.strokeStyle = "#000"; c.lineWidth = 1.2; c.beginPath();
  c.moveTo(M.x,M.y); c.lineTo(M.x+12,M.y+11); c.lineTo(M.x+6,M.y+11); c.lineTo(M.x+3,M.y+19); c.lineTo(M.x,M.y+18); c.closePath(); c.fill(); c.stroke(); c.restore(); }
function silhouette(a=1){   // a tall dark figure with two pale eyes, drawn, never photographic
  c.save(); c.globalAlpha = a; const x = W/2, b = H*.98, h = H*.9;
  c.fillStyle = "#000"; c.beginPath(); c.ellipse(x,b-h,h*.06,h*.08,0,0,7); c.fill(); c.fillRect(x-h*.018,b-h,h*.036,h*.1);
  c.beginPath(); c.moveTo(x-h*.09,b-h*.88); c.lineTo(x+h*.09,b-h*.88); c.lineTo(x+h*.06,b); c.lineTo(x-h*.06,b); c.fill();
  c.fillRect(x-h*.12,b-h*.86,h*.03,h*.5); c.fillRect(x+h*.09,b-h*.86,h*.03,h*.5);
  c.fillStyle = "#e8e0d2"; c.fillRect(x-h*.03,b-h*1.005,h*.012,h*.008); c.fillRect(x+h*.02,b-h*1.005,h*.012,h*.008); c.restore(); }
function fog(t){ c.fillStyle = "#000"; c.fillRect(0,0,W,H);
  const g = c.createRadialGradient(W*(.5+Math.sin(t*.1)*.15),H*.55,10,W/2,H/2,Math.max(W,H)*.6); g.addColorStop(0,"rgba(80,8,16,.35)"); g.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle = g; c.fillRect(0,0,W,H); }

/* ------------------------------------------------------------ story scenes */
function story(lines,done){
  let i = 0, ch = 0, t = 0;
  AU.drone(true);
  return dt => { t += dt; fog(t);
    const sub = s => s.replace(/{name}/g,shown()).replace(/{first}/g,first()).replace(/{deaths}/g,G.deaths);
    const [who,raw] = lines[i], body = sub(raw), before = Math.floor(ch);
    ch = Math.min(body.length, ch + dt*(who === "it" ? 22 : 44)); if(Math.floor(ch) !== before && who === "sys") AU.tick();
    const col = w => w === "it" ? "#ff2d55" : "#7dffb0";
    for(let k=Math.max(0,i-2);k<i;k++) txt(sub(lines[k][1]),W/2,H*.42-(i-k)*34,Math.min(16,W/40),"#3a4a40","center");
    const size = Math.min(22, W/32), words = body.slice(0,Math.floor(ch)).split(" "); let line = "", y = H*.42;
    c.font = `${who === "it" ? "bold " : ""}${size}px ${MONO}`;
    for(const w of words){ const test = line + w + " "; if(c.measureText(test).width > W*.8 && line){ txt(line,W/2,y,size,col(who),"center",who === "it" ? "bold" : ""); line = w + " "; y += size*1.6; } else line = test; }
    txt(line,W/2,y,size,col(who),"center",who === "it" ? "bold" : "");
    txt(ch >= body.length ? "▸ click" : "",W/2,H-40,12,"#3a4a40","center");
    if(M.click || keyq.includes(" ") || keyq.includes("Enter")){ if(ch < body.length) ch = body.length; else { ch = 0; i++; if(i >= lines.length){ done(); return; } if(lines[i][0] === "it") { AU.thump(.4); AU.whisper(sub(lines[i][1]).toLowerCase().slice(0,30)); } } }
    pointer("#7dffb0"); };
}

/* ------------------------------------------------------------ title + name */
function title(){
  let t = 0; AU.drone(false);
  return dt => { t += dt; fog(t);
    const gl = Math.random() < .04 ? rnd(-6,6) : 0;
    txt("NIMBUS",W/2+gl,H*.36,Math.min(96,W/7),"#c81f2b","center","bold"); if(gl) txt("NIMBUS",W/2-gl,H*.36,Math.min(96,W/7),"rgba(60,230,255,.4)","center","bold");
    txt("THE ARCHIVE",W/2,H*.36+36,Math.min(22,W/30),"#7d1119","center");
    txt("click to begin",W/2,H*.6,16,Math.sin(t*3) > 0 ? "#7dffb0" : "#2c6b40","center");
    txt("headphones recommended · contains darkness, loud sounds and sudden images",W/2,H-62,12,"#5a6a60","center");
    txt(`C: calm mode (no flashes, no shaking) — ${FX.calm ? "ON" : "off"}`,W/2,H-40,12,FX.calm ? "#7dffb0" : "#5a6a60","center");
    txt("nothing you type leaves this tab",W/2,H-20,11,"#3a4a40","center");
    if(keyq.some(k => k.toLowerCase() === "c")) FX.calm = !FX.calm;
    if(M.click){ AU.hit(); go(nameScene()); }
    pointer(); };
}
function nameScene(){
  let t = 0, s = "";
  return dt => { t += dt; fog(t);
    txt("SIGN THE GUESTBOOK",W/2,H*.3,Math.min(30,W/20),"#c81f2b","center","bold");
    txt("every name in this book is kept. type yours (any name will do — a made-up one is fine).",W/2,H*.3+34,Math.min(14,W/50),"#7dffb0","center");
    for(const k of keyq){ if(k === "Backspace") s = s.slice(0,-1); else if(k === "Enter" && s.trim()) { G.name = s.trim(); AU.stinger(); go(story(INTRO,() => startLevel(1))); return; } else if(k.length === 1 && s.length < 14) { s += k; AU.tick(); } }
    txt(s + (Math.floor(t*2)%2 ? "▌" : " "),W/2,H*.5,Math.min(44,W/12),"#e8e0d0","center");
    c.fillStyle = "#3a1015"; c.fillRect(W/2-190,H*.5+12,380,2);
    txt("press Enter",W/2,H*.5+60,13,"#3a4a40","center");
    if(!s && t > 12) txt("(or just press Enter on a blank line to sign as Guest)",W/2,H*.5+84,12,"#3a4a40","center");
    if(keyq.includes("Enter") && !s.trim() && t > 12){ G.name = "Guest"; go(story(INTRO,() => startLevel(1))); }
    pointer(); };
}

/* ------------------------------------------------------------ level wrapper */
const LEVELS = {};
function startLevel(n){ if(n > 5) return finale(); go(runLevel(n,false)); }
function runLevel(n,skipIntro){
  const L = LEVELS[n]; G.lvl = n; G.ld[n] = G.ld[n] || 0;
  let phase = skipIntro ? "play" : "intro", t = 0, step = null, res = null, endT = 0;
  const assist = Math.min(3,G.ld[n]);
  const begin = () => { step = L.make(assist); phase = "play"; AU.drone(true); FX.dread = 0; };
  if(skipIntro) begin();
  return dt => { t += dt;
    if(phase === "intro"){ fog(t);
      txt(`LEVEL ${n}`,W/2,H*.3,16,"#7d1119","center"); txt(L.name,W/2,H*.3+46,Math.min(48,W/12),"#c81f2b","center","bold");
      txt(L.goal,W/2,H*.3+90,Math.min(16,W/40),"#7dffb0","center"); txt(L.how,W/2,H*.3+118,Math.min(13,W/50),"#5a8a6a","center");
      if(n === 3 && t > 1.2 && t < 1.3) silhouette(.6);
      txt("click to start",W/2,H*.75,14,Math.sin(t*3) > 0 ? "#7dffb0" : "#2c6b40","center");
      if(M.click && t > .4) begin(); pointer(); return; }
    if(phase === "play"){ const r = step(dt); if(r){ res = r; phase = "end"; endT = 0; AU.heart(0); if(r === "lose"){ AU.hit(); shake(14); } else { AU.chord(); } } return; }
    endT += dt; c.fillStyle = "rgba(0,0,0,.07)"; c.fillRect(0,0,W,H);
    if(res === "win"){ if(endT > 1.8){ const nx = () => startLevel(n+1); go(story(AFTER[n],nx)); } return; }
    if(endT > 1.7){ fog(endT); const lost = takeLetter(); if(!lost && !runLevel.said) runLevel.said = 1;
      G.deaths++; G.ld[n]++; AU.stinger();
      go(deathCard(n)); }
  };
}
function deathCard(n){
  let t = 0; const line = pick(["IT KEPT A LETTER","IT WAS FASTER","HOLD STILL","IT WAS NEVER FAR"]);
  return dt => { t += dt; c.fillStyle = "#000"; c.fillRect(0,0,W,H);
    if(t < .2) silhouette(.5);
    txt(line,W/2,H*.38,Math.min(34,W/16),"#ff2d55","center","bold");
    txt(shown().toUpperCase(),W/2,H*.38+54,Math.min(40,W/14),"#e8e0d0","center","bold");
    txt(`it gets easier to hold the door each time. (assist ${Math.min(3,G.ld[n])}/3)`,W/2,H*.38+92,12,"#5a6a60","center");
    if(t > 1.2){ txt("click to try again",W/2,H*.75,14,Math.sin(t*3) > 0 ? "#7dffb0" : "#2c6b40","center"); if(M.click){ go(runLevel(n,true)); } }
    pointer("#ff2d55"); };
}

/* ====================================================================
   LEVEL 1 — THE THREAD
   ==================================================================== */
const TITLES = ["it charges after you cancel","the moderator is not a person","has anyone actually gotten out","it repeated my name back",
  "do not sign the book","it asked me to hold","door nine is the last one","something green keeps typing to me","i can hear it in the fan",
  "please someone answer this","they removed the thread but i saved it","does it know you are reading now"];
LEVELS[1] = {name:"THE THREAD", goal:"Click threads while the red bar is eating them. Survive 45 seconds.", how:"Purple [MOD] threads are traps. Chain saves to heal.",
make(a){
  const N = 9, rows = Array.from({length:N},() => ({t:pick(TITLES),del:0,sp:0,trap:false,ok:0,bad:0}));
  let hp = 100, t = 0, sp = 0, combo = 0, saved = 0; const GOAL = 45, top = 70;
  return dt => { t += dt; sp += dt; const rh = Math.min(54,(H-top-40)/N);
    FX.dread = clamp((t-18)/40,0,.7);
    c.fillStyle = "#171a24"; c.fillRect(0,0,W,H);
    c.fillStyle = "#222738"; c.fillRect(0,56,W,28); txt("nimbus-support board — billing — 4,102 topics",16,75,12,"#6d7aa0");
    if(sp > Math.max(.4,1.6-t*.02)*(1+a*.25)){ sp = 0; const free = rows.filter(r => !r.del && !r.ok);
      if(free.length){ const r = pick(free); r.del = .001; r.sp = (.3+t*.0045)*(1-a*.12); r.trap = t > 8 && Math.random() < .16;
        if(t > 20 && Math.random() < .35) r.t = pick([`${shown()} is reading this`,`${first()}, do not look behind you`,`${shown().toLowerCase()} posted 4 minutes ago`]); } }
    rows.forEach((r,i) => { const y = top+30+i*rh;
      c.fillStyle = r.ok > 0 ? `rgba(60,230,143,${r.ok*.5})` : i%2 ? "#1c2030" : "#20253a"; c.fillRect(0,y,W,rh-2);
      if(r.ok > 0) r.ok -= dt*1.5; if(r.bad > 0){ r.bad -= dt; c.fillStyle = `rgba(255,45,85,${r.bad*.4})`; c.fillRect(0,y,W,rh-2); }
      if(r.del){ c.fillStyle = r.trap ? "rgba(140,0,150,.5)" : "rgba(190,20,30,.5)"; c.fillRect(0,y,W*r.del,rh-2);
        if(r.trap) txt("[MOD]",W-24,y+rh*.6,12,"#d070ff","right","bold");
        r.del += r.sp*dt; if(r.del >= 1){ r.del = 0; if(!r.trap){ hp -= 10; combo = 0; shake(7); flash("#b31414",.2); AU.thump(.5); pop("DELETED −10",W/2,y,"#ff5e7a"); } r.bad = .8; r.t = pick(TITLES); r.trap = false; } }
      txt(r.t.slice(0,Math.floor(W/9)),20,y+rh*.62,Math.min(15,rh*.38),r.del ? (r.trap ? "#d070ff" : "#ff8098") : "#9ab0e0");
      if(M.click && M.y >= y && M.y < y+rh-2 && r.del){
        if(r.trap){ hp -= 20; combo = 0; flash("#8000a0",.25); shake(10); AU.hit(); pop("HONEYPOT −20",M.x,M.y,"#d070ff"); }
        else { saved++; combo++; G.score += combo; AU.blip(Math.min(combo,14)); burst(M.x,M.y,"#ffcc4d",14); pop(`ARCHIVED ×${combo}`,M.x,M.y,"#ffcc4d");
          if(combo%5 === 0){ hp = Math.min(100,hp+6); AU.chord(); pop("+6",M.x,M.y-24,"#7dffb0"); } }

        if(!solid(nx-r,P.y-r)&&!solid(nx+r,P.y-r)&&!solid(nx-r,P.y+r)&&!solid(nx+r,P.y+r)) P.x = nx; if(!solid(P.x-r,ny-r)&&!solid(P.x+r,ny-r)&&!solid(P.x-r,ny+r)&&!solid(P.x+r,ny+r)) P.y = ny;
        if(stepT <= 0){ stepT = sprint ? .28 : .45; AU.step(); } }
      if(keyq.includes("f") || keyq.includes("F") || keyq.includes(" ") || (M.click && M.y < H*.35)){ fl = !fl; AU.tick(); }
      for(const f of fuses) if(!f.got && dist(P.x,P.y,f.x,f.y) < .6){ f.got = true; got++; AU.chord(); flash("#7dffb0",.2); pop(`FUSE ${got}/3`,W/2,H*.4,"#7dffb0",26); if(got === 3) pop("THE EXIT IS LIVE",W/2,H*.4+34,"#7dffb0",20); }
      if(got === 3 && dist(P.x,P.y,EX[0]+.5,EX[1]+.5) < .6){ fin = 1; AU.chord(); }
      const moving = fwd !== 0, noise = sprint && moving ? 7 : moving ? 3 : 1.2;
      bat = clamp(bat+(fl ? -1.5 : 5)*dt,0,100); if(bat <= 0) fl = false;
      const d = Math.hypot(P.x-Mo.x,P.y-Mo.y), sees = los() && d < (fl ? 9 : 2.2), hears = d < noise;
      if(sees || hears){ if(Mo.hunt <= 0){ AU.shriek(); AU.duck(.25); } Mo.hunt = 5; Mo.tgt = [P.x|0,P.y|0]; } else Mo.hunt = Math.max(0,Mo.hunt-dt);
      Mo.pt -= dt; if(Mo.pt <= 0){ Mo.pt = .35; if(Mo.hunt > 0) Mo.tgt = [P.x|0,P.y|0];
        else if(!Mo.tgt || (Mo.x|0) === Mo.tgt[0] && (Mo.y|0) === Mo.tgt[1]){ const o = pick(open); Mo.tgt = [o[0],o[1]]; }
        Mo.path = bfs(Mo.x|0,Mo.y|0,Mo.tgt[0],Mo.tgt[1]); }
      const ms = Mo.hunt > 0 ? 2.25+t*.003-a*.2 : 1.05; if(Mo.path.length){ const [tx,ty] = Mo.path[0], dx = tx+.5-Mo.x, dy = ty+.5-Mo.y, dd = Math.hypot(dx,dy); if(dd < .08) Mo.path.shift(); else { Mo.x += dx/dd*ms*dt; Mo.y += dy/dd*ms*dt; } }
      Mo.st += dt; if(Mo.st > (Mo.hunt > 0 ? .32 : .8) && d < 10){ Mo.st = 0; AU.tone(70,"sine",.2,Math.min(.6,2.4/(d+1)),30); }
      AU.heart(d < 8 ? 55+(8-d)*14 : 0); FX.dread = clamp((6-d)/6,0,1)*.9;
      if(d < .55){ caught = 1; AU.stinger(); shake(20); flash("#fff",.5); }
    }
    rays();
    const R = fl ? 3.2+bat/100*4.5 : .9, lf = fl ? flick : 1; fT -= dt; if(fT <= 0){ fT = .05+Math.random()*.2; flick = Math.random() < (bat < 35 ? .35 : .06) ? .4+Math.random()*.4 : 1; }
    c.fillStyle = "#000"; c.fillRect(0,0,W,H); const fg = c.createLinearGradient(0,H/2,0,H); fg.addColorStop(0,"#000"); fg.addColorStop(1,fl ? "#14100c" : "#050403"); c.fillStyle = fg; c.fillRect(0,H/2,W,H/2);
    const cw = W/RW;
    for(let col=0;col<RW;col++){ const d = zb[col], h = H/d, s = Math.pow(clamp(1-d/R,0,1),1.35)*lf, sd = rays.d[col] ? .7 : 1, y0 = H/2-h/2;
      c.fillStyle = `rgb(${110*s*sd|0},${92*s*sd|0},${78*s*sd|0})`; c.fillRect(col*cw,y0,cw+1,h); }
    const proj = (x,y) => { const dx = x-P.x, dy = y-P.y, d = Math.hypot(dx,dy); let rel = Math.atan2(dy,dx)-P.a; while(rel > Math.PI) rel -= 6.283; while(rel < -Math.PI) rel += 6.283;
      const col = RW/2*(1+Math.tan(rel)/Math.tan(FOV/2)); return {d,rel,col,sx:col*cw,ok:Math.abs(rel) < FOV/2+.2 && col >= 0 && col < RW && zb[col|0] > d-.2}; };
    for(const f of fuses){ if(f.got) continue; const p = proj(f.x,f.y); if(!p.ok) continue; const sz = H/p.d*.16, y = H/2+H/p.d*.2;
      const gg = c.createRadialGradient(p.sx,y,1,p.sx,y,sz*3); gg.addColorStop(0,"rgba(125,255,176,.9)"); gg.addColorStop(1,"rgba(125,255,176,0)"); c.fillStyle = gg; c.fillRect(p.sx-sz*3,y-sz*3,sz*6,sz*6);
      c.fillStyle = "#e8fff0"; c.fillRect(p.sx-sz*.3,y-sz*.5,sz*.6,sz); }
    { const ep = proj(EX[0]+.5,EX[1]+.5); if(ep.ok){ const sz = H/ep.d*.5; c.fillStyle = got === 3 ? `rgba(60,230,143,${.5+Math.sin(t*5)*.2})` : "rgba(120,20,30,.5)"; c.fillRect(ep.sx-sz*.3,H/2-sz*.5,sz*.6,sz*1.4); } }
    { const p = proj(Mo.x,Mo.y), vis = clamp(1-p.d/(R+1.5),0,1)*lf; if(p.ok && p.d > .2){ const h = H/p.d*.95, w = h*.13, fy = H/2+H/p.d/2, ty = fy-h;
        if(vis > .05){ const v = Math.floor(vis*160); c.fillStyle = `rgb(${v*.5|0},${v*.45|0},${v*.4|0})`; c.fillRect(p.sx-w/2,ty+h*.14,w,h*.86);
          c.fillRect(p.sx-w*2.2,ty+h*.2,w*.6,h*.55); c.fillRect(p.sx+w*1.6,ty+h*.2,w*.6,h*.55);
          c.fillStyle = `rgb(${v*1.1|0},${v|0},${v*.9|0})`; c.beginPath(); c.ellipse(p.sx,ty+h*.08,w*.9,h*.075,0,0,7); c.fill();
          c.fillStyle = "#300"; c.fillRect(p.sx-w*.3,ty+h*.11,w*.6,Math.max(2,h*.02)); }
        if(Mo.hunt > 0 || p.d < R+2){ c.fillStyle = "rgba(235,228,214,.9)"; const e = Math.max(2,h*.013); c.fillRect(p.sx-w*.45,ty+h*.07,e*1.6,e); c.fillRect(p.sx+w*.2,ty+h*.07,e*1.6,e); } } }
    c.fillStyle = `rgba(0,0,0,${fl ? 0 : .25})`; c.fillRect(0,0,W,H);
    if(caught){ caught++; c.fillStyle = `rgba(0,0,0,${Math.min(1,(caught-1)/50)})`; c.fillRect(0,0,W,H); if(caught > 12 && caught < 20) silhouette(.9); if(caught > 70) return "lose"; }
    if(fin){ fin += dt*60; c.fillStyle = `rgba(20,190,90,${Math.min(1,(fin)/60)})`; c.fillRect(0,0,W,H); if(fin > 70) return "win"; }
    c.fillStyle = "#111"; c.fillRect(W/2-60,H-26,120,8); c.fillStyle = bat < 25 ? "#ff2d55" : "#ffd97a"; c.fillRect(W/2-60,H-26,120*bat/100,8); txt(fl ? "LIGHT ON — it can see it" : "LIGHT OFF — hold still",W/2,H-34,11,"#8a8a70","center");
    if(t < 9) txt("find the 3 green fuses · the thing hunts by light and sound",W/2,H*.82,13,"#7dffb0","center");
    hud("THE BASEMENT",`FUSES ${got}/3`,100,Mo.hunt > 0 ? "IT SEES YOU" : (Math.hypot(P.x-Mo.x,P.y-Mo.y) < 4 ? "it is close" : ""));
  };
}};

/* ------------------------------------------------------------ story text */
const INTRO = [
  ["sys","hello? you signed the book. good. nobody signs it any more."],
  ["sys","i'm syslog. i'm what's left of a person called Aaron Voss. i'll explain when we aren't being watched."],
  ["it","WELCOME, {name}. YOUR ACCOUNT IS IN GOOD STANDING. IT WILL REMAIN SO."],
  ["sys","every time it catches you it keeps a letter of your name. lose enough letters and there's nothing left to call you by."],
  ["sys","five rooms. i'll hold the doors as long as i can. go."]
];
const AFTER = {
  1:[["sys","you held the board. two people before you managed that."],["it","THANK YOU FOR CONTINUING. MOST STOP HERE."]],
  2:[["sys","the page is a mess but it's still 1997 in there. it can't delete 1997."],["it","I CAN SEE THE ROOM, {first}. I CAN SEE THE ROOM."],["sys","it can't. it can't. keep moving."]],
  3:[["sys","you got down the hall. i've watched twenty-three people try that."],["it","THE SMILING ONES WERE PEOPLE. I KEPT THE FACE."]],

  5:[["sys","you found the fuses. you found the door."],["it","IT DOES NOT GO ANYWHERE, {first}. NONE OF THEM DO."]]

/* ------------------------------------------------------------ ending */
function finale(){
  AU.stop(); const kept = (G.name || "Guest").replace(/[^\w]/g,"").length-G.taken.length, total = (G.name || "Guest").replace(/[^\w]/g,"").length;
  const verdict = G.deaths === 0 ? "you never let it touch you. it lets you leave. it says: come back tomorrow."
    : G.taken.length === 0 ? "it kept nothing. it kept the memory of trying."
    : kept <= 2 ? "there is hardly a name left. it will keep the rest."
    : `you walked out with ${kept} of ${total} letters.`;
  let t = 0;
  go(story([["it","GOODNIGHT, {name}."],["sys",verdict],["sys","thank you for playing. the book is closed. you can close the tab."]],() => go(ledger(verdict))));
}
function ledger(verdict){
  let t = 0; AU.drone(true);
  const rows = [...VICTIMS.map(v => [v[0],v[1],v[2]]),[shown(),2026,Math.round(G.score)]];
  return dt => { t += dt; fog(t);
    txt("THE BOOK",W/2,H*.2,Math.min(30,W/20),"#c81f2b","center","bold");
    rows.forEach((r,i) => { const y = H*.32+i*30, you = i === rows.length-1; txt(r[0],W/2-170,y,15,you ? "#ff2d55" : "#6a2a30","left",you ? "bold" : ""); txt(String(r[1]),W/2+40,y,15,you ? "#ff2d55" : "#6a2a30","left"); txt(String(r[2]),W/2+130,y,15,you ? "#ff2d55" : "#6a2a30","left"); });
    txt(`letters kept: ${shown()}`,W/2,H*.32+rows.length*30+40,14,"#7dffb0","center");
    txt(`deaths: ${G.deaths}`,W/2,H*.32+rows.length*30+64,14,"#5a8a6a","center");
    txt("click to play again",W/2,H-50,13,Math.sin(t*3) > 0 ? "#7dffb0" : "#2c6b40","center");
    if(t > 20 && Math.random() < dt*.02) { AU.knock(2); }
    if(M.click && t > 1){ Object.assign(G,{name:"",taken:[],deaths:0,lvl:0,ld:{},score:0,held:0}); AU.stop(); go(title()); }
    pointer(); };
}
